name: WS2M Hub (devel)
version: "4.0.1-dev.41"
slug: ws2m-hub-devel
description: >-
  ⚠️ UNSTABLE — development/testing only. Tracks the dev branch of
  WS2M Hub. May contain incomplete features or breaking changes.
  Do not use in production.
url: https://github.com/raetha/wyzesense2mqtt
arch:
  - amd64
  - aarch64
init: false
boot: manual

# Supervisor pulls <image>:<version>; the version is the test build's image tag,
# set by .github/workflows/sync.yml from ws2m's dev builds (<X.Y.Z>-dev.<build>).
image: "ghcr.io/raetha/ws2m-hub"

services:
  - mqtt:want

usb: true

options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_client_id: ws2m-devel
  mqtt_clean_session: false
  mqtt_keepalive: 60
  self_topic_root: ws2m
  hass_topic_root: homeassistant
  hass_discovery: true
  dongle: auto
  log_level: DEBUG

schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: str
  mqtt_client_id: str
  mqtt_clean_session: bool
  mqtt_keepalive: int
  self_topic_root: str
  hass_topic_root: str
  hass_discovery: bool
  dongle: str
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
