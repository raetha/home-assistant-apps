name: Sync stable app version

on:
  repository_dispatch:
    types: [ws2m-release]

jobs:
  sync:
    name: Update ws2m-hub app version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update version in config.yaml
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          echo "Updating stable app to version ${VERSION}"
          sed -i "s/^version: .*/version: \"${VERSION}\"/" ws2m-hub/config.yaml
          grep "^version:" ws2m-hub/config.yaml

      - name: Commit version bump
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ws2m-hub/config.yaml
          git diff --staged --quiet || git commit -m "chore: bump ws2m-hub to ${VERSION}"
          git push
