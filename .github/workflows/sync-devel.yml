name: Sync devel app version

on:
  repository_dispatch:
    types: [ws2m-devel]

jobs:
  sync:
    name: Update ws2m-hub-devel app version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate versioned devel version
        id: version
        env:
          BASE: ${{ github.event.client_payload.version }}
        run: |
          # Append today's date to the base version from ws2m config.py.
          # Multiple pushes on the same day are idempotent — version only
          # changes when either the base version or the date changes.
          DATE=$(date -u +%Y%m%d)
          VERSION="${BASE}-devel.${DATE}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Generated version: ${VERSION}"

      - name: Update version in config.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: \"${VERSION}\"/" ws2m-hub-devel/config.yaml
          grep "^version:" ws2m-hub-devel/config.yaml

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ws2m-hub-devel/config.yaml
          git diff --staged --quiet || git commit -m "chore: bump ws2m-hub-devel to ${VERSION}"
          git push
