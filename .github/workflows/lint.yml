name: Lint
# Every push to main or dev, every pull request, and daily (the schedule runs main's copy):
# Home Assistant's app linter over every app folder.

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

# Actions are pinned to exact commits (version in the comment); Dependabot
# (.github/dependabot.yml) proposes updates weekly.

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.apps.outputs.addons_list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find app folders
        id: apps
        uses: home-assistant/actions/helpers/find-addons@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-10-26

  lint:
    name: Lint ${{ matrix.path }}
    needs: find
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Home Assistant app linter
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: "./${{ matrix.path }}"

  # The one check the main ruleset requires: passes only when every check job above did, so
  # jobs can be added or renamed without touching the ruleset.
  ci:
    name: CI passed
    if: always()
    needs: [find, lint]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every check job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
