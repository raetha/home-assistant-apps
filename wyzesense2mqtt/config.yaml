name: WyzeSense2MQTT
version: "4.0.0"
slug: wyzesense2mqtt
description: >-
  Local Wyze Sense Bridge gateway that publishes sensor events to MQTT with
  full Home Assistant MQTT discovery support. No Wyze account or cloud
  access required.
url: https://github.com/raetha/wyzesense2mqtt
arch:
  - amd64
  - aarch64
init: false

# Pull the pre-built image from GHCR rather than building locally.
# The image tag is kept in sync with the version above.
image: "ghcr.io/raetha/wyzesense2mqtt"

# Declares use of the Supervisor MQTT services API for Mosquitto
# auto-discovery.
services:
  - mqtt:want

# usb: true enables the USB device picker in the app UI.
usb: true

options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_client_id: ws2m
  mqtt_clean_session: false
  mqtt_keepalive: 60
  mqtt_qos: 0
  mqtt_retain: true
  self_topic_root: ws2m
  hass_topic_root: homeassistant
  hass_discovery: true
  publish_sensor_name: true
  usb_dongle: /dev/hidraw0
  log_level: INFO

schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: str
  mqtt_client_id: str
  mqtt_clean_session: bool
  mqtt_keepalive: int
  mqtt_qos: int
  mqtt_retain: bool
  self_topic_root: str
  hass_topic_root: str
  hass_discovery: bool
  publish_sensor_name: bool
  usb_dongle: str
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
